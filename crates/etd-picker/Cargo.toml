[package]
name = "etd-picker"
version = "1.0.0"
edition = "2021"
authors = ["Emir Tuğra Dağ"]
description = "Ultra-lightweight screen color picker for Windows"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
winres = "0.1"
