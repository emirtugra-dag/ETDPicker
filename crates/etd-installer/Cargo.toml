[package]
name = "etd-installer"
version = "1.0.0"
edition = "2021"
authors = ["Emir Tuğra Dağ"]
description = "ETDPicker Custom Setup Wizard and Uninstaller"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"
